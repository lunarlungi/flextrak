<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>FlexTrak</title>
<style>
  :root{
    --accent:#14b8a6; --accent-dim:#0f8a80;
    --radius:16px; --radius-sm:10px; --tap:56px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0e1116;--bg-2:#161b22;--bg-3:#1e252e;--card:#161b22;--card-2:#1e252e;
    --text:#e8edf2;--text-2:#9aa7b4;--text-3:#5f6b78;--border:#252d38;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f4f6f9;--bg-2:#ffffff;--bg-3:#eef1f5;--card:#ffffff;--card-2:#f4f6f9;
    --text:#1a2230;--text-2:#5a6675;--text-3:#95a1b0;--border:#e3e8ef;
    --shadow:0 6px 20px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);
    overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;
    max-width:520px;margin:0 auto;background:var(--bg);}

  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;background:var(--bg);
    position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.3px;}
  .topbar .accent-dot{color:var(--accent);}
  .topbar .date{font-size:13px;color:var(--text-2);font-weight:500;}

  main#view{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:700;}
  .muted{color:var(--text-2);font-size:14px;line-height:1.5;}
  .tiny{color:var(--text-3);font-size:12px;}
  .section-title{font-size:13px;font-weight:700;color:var(--text-2);
    text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 10px;}

  .stat-row{display:flex;gap:12px;margin-bottom:14px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 14px;text-align:center;box-shadow:var(--shadow);}
  .stat .num{font-size:26px;font-weight:800;color:var(--accent);line-height:1;}
  .stat .lbl{font-size:12px;color:var(--text-2);margin-top:6px;font-weight:600;}

  .quote{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;border:none;}
  .quote .q{font-size:16px;font-weight:600;line-height:1.5;font-style:italic;}
  .quote .a{font-size:13px;margin-top:10px;opacity:.85;font-weight:600;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:var(--tap);width:100%;background:var(--accent);color:#fff;border:none;
    border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font);
    transition:transform .05s ease,filter .15s ease;}
  .btn:active{transform:scale(.98);filter:brightness(.95);}
  .btn.secondary{background:var(--bg-3);color:var(--text);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}

  .empty{text-align:center;padding:48px 20px;color:var(--text-2);}
  .empty .ico{font-size:44px;margin-bottom:14px;opacity:.7;}
  .empty h3{font-size:17px;margin:0 0 8px;color:var(--text);font-weight:700;}
  .empty .phase{display:inline-block;margin-top:14px;padding:6px 14px;background:var(--bg-3);
    border-radius:999px;font-size:12px;font-weight:700;color:var(--accent);}

  .set-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
    min-height:var(--tap);border-bottom:1px solid var(--border);}
  .set-row:last-child{border-bottom:none;}
  .set-row.tap{cursor:pointer;}
  .set-row.tap:active{background:var(--bg-3);}
  .set-row .label{font-size:15px;font-weight:600;}
  .set-row .sub{font-size:12px;color:var(--text-2);margin-top:2px;}
  .set-row .chev{color:var(--text-3);font-size:18px;}

  .switch{position:relative;width:52px;height:30px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:var(--bg-3);border-radius:999px;transition:.2s;
    cursor:pointer;border:1px solid var(--border);}
  .slider:before{content:"";position:absolute;height:24px;width:24px;left:2px;top:2px;background:#fff;
    border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch input:checked + .slider{background:var(--accent);border-color:var(--accent);}
  .switch input:checked + .slider:before{transform:translateX(22px);}

  .seg{display:flex;background:var(--bg-3);border-radius:var(--radius-sm);padding:3px;gap:3px;}
  .seg button{border:none;background:transparent;color:var(--text-2);padding:8px 16px;border-radius:8px;
    font-weight:700;font-size:14px;cursor:pointer;font-family:var(--font);min-height:40px;}
  .seg button.on{background:var(--accent);color:#fff;}

  .swatches{display:flex;gap:12px;padding:16px 18px;flex-wrap:wrap;}
  .swatch{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s;}
  .swatch:active{transform:scale(.9);}
  .swatch.on{border-color:var(--text);}

  nav.tabbar{display:flex;background:var(--bg-2);border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);}
  nav.tabbar button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:9px 0 8px;color:var(--text-3);font-family:var(--font);min-height:var(--tap);}
  nav.tabbar button .ico{font-size:22px;line-height:1;}
  nav.tabbar button .lbl{font-size:10px;font-weight:700;letter-spacing:.2px;}
  nav.tabbar button.on{color:var(--accent);}
  nav.tabbar button.center .ico{background:var(--accent);color:#fff;width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin-top:-14px;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:24px;}

  .fade{animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- LIBRARY ---------- */
  .search{width:100%;min-height:48px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text);font-size:15px;padding:0 16px;font-family:var(--font);
    margin-bottom:12px;}
  .search::placeholder{color:var(--text-3);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 8px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--text-2);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:38px;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .filter-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;
    letter-spacing:.5px;margin:6px 4px 4px;}

  .ex-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);}
  .ex-card:active{background:var(--bg-3);}
  .ex-thumb{width:48px;height:48px;border-radius:12px;background:var(--bg-3);display:flex;align-items:center;
    justify-content:center;font-size:22px;flex:0 0 auto;overflow:hidden;}
  .ex-thumb img{width:100%;height:100%;object-fit:cover;}
  .ex-info{flex:1;min-width:0;}
  .ex-info .n{font-size:15px;font-weight:700;margin-bottom:3px;}
  .ex-info .m{font-size:12px;color:var(--text-2);}
  .badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;
    background:var(--bg-3);color:var(--text-2);margin-left:6px;text-transform:uppercase;letter-spacing:.3px;}
  .badge.b{color:#22c55e;} .badge.i{color:#f59e0b;} .badge.a{color:#f43f5e;}

  .result-count{font-size:12px;color:var(--text-3);margin:2px 4px 10px;font-weight:600;}

  /* ---------- DETAIL ---------- */
  .backbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .back-btn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--border);
    color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .back-btn:active{background:var(--bg-3);}
  .detail-title{font-size:20px;font-weight:800;letter-spacing:-.3px;}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .meta{font-size:12px;font-weight:700;background:var(--bg-3);color:var(--text-2);padding:6px 12px;border-radius:999px;}
  .bodymap{display:flex;justify-content:center;padding:8px 0 4px;}
  .map-legend{display:flex;justify-content:center;gap:18px;margin-top:4px;font-size:11px;color:var(--text-2);font-weight:600;}
  .map-legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s;}
  .steps li{position:relative;padding:0 0 12px 34px;color:var(--text);font-size:14px;line-height:1.5;counter-increment:s;}
  .steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .mlist{margin:0;padding:0;list-style:none;}
  .mlist li{padding:8px 0 8px 22px;position:relative;font-size:14px;color:var(--text);line-height:1.45;border-bottom:1px solid var(--border);}
  .mlist li:last-child{border-bottom:none;}
  .mlist li:before{content:"!";position:absolute;left:0;top:8px;width:16px;height:16px;border-radius:50%;
    background:#f43f5e;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .alt-chip{display:inline-block;background:var(--bg-3);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;margin:0 8px 8px 0;cursor:pointer;}
  .alt-chip.dead{color:var(--text-3);cursor:default;}
  .img-slot{border:2px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;
    color:var(--text-2);cursor:pointer;font-size:14px;font-weight:600;}
  .img-slot img{max-width:100%;border-radius:12px;display:block;}
  .img-actions{display:flex;gap:10px;margin-top:10px;}
  .img-actions .btn{min-height:44px;font-size:14px;}

  svg .body{fill:var(--bg-3);}
  svg .m{fill:var(--bg-3);stroke:var(--border);stroke-width:.6;transition:fill .2s;}
  svg .m.hs{fill:var(--accent);fill-opacity:.4;}
  svg .m.hp{fill:var(--accent);}
  svg text{fill:var(--text-3);font-size:11px;font-weight:700;font-family:var(--font);}

  .card.warn{border-color:#f59e0b;background:linear-gradient(180deg,rgba(245,158,11,.10),transparent);}
  .warn-h{font-weight:800;font-size:15px;color:#f59e0b;}

  /* goals */
  .goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .goal{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:18px 14px;
    text-align:center;cursor:pointer;box-shadow:var(--shadow);}
  .goal .gi{font-size:28px;}
  .goal .gn{font-size:14px;font-weight:700;margin-top:8px;}
  .goal.on{border-color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent);}
  .hub-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .plan-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
  .plan-card:active{background:var(--bg-3);}
  .plan-card .n{font-size:16px;font-weight:700;}
  .day-card{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
  .day-card:active{background:var(--bg-3);}
  .day-card .n{font-size:15px;font-weight:700;}
  .wk-ex{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .wk-ex:last-child{border-bottom:none;}
  .wk-ex .ex-info .n{font-size:14px;font-weight:700;margin-bottom:2px;}
  .wk-ex .sr{font-size:14px;font-weight:800;color:var(--accent);white-space:nowrap;}
  .builder-ex{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .builder-ex .n{font-size:14px;font-weight:700;}
  .mini-input{width:62px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font-size:14px;font-family:var(--font);text-align:center;}
  .icon-btn{width:32px;height:26px;background:var(--bg-3);border:1px solid var(--border);border-radius:7px;color:var(--text-2);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:100;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .sess-head{position:sticky;top:0;background:var(--bg);padding:6px 0 12px;z-index:5;}
  .sess-timer{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
  .progress-track{height:8px;background:var(--bg-3);border-radius:999px;margin-top:10px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}
  .sx-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;box-shadow:var(--shadow);}
  .sx-card.skipped{opacity:.5;}
  .sx-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .sx-head .n{font-size:15px;font-weight:700;}
  .sx-head .m{font-size:12px;color:var(--text-2);margin-top:2px;}
  .sx-count{font-size:13px;font-weight:800;color:var(--accent);background:var(--bg-3);padding:5px 11px;border-radius:999px;flex:0 0 auto;}
  .logrow{display:flex;align-items:center;gap:8px;padding:5px 0;}
  .logrow.done{opacity:.55;}
  .setno{width:18px;text-align:center;font-weight:800;color:var(--text-3);font-size:13px;flex:0 0 auto;}
  .log-input{flex:1;min-width:0;background:var(--bg-3);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:11px 8px;font-size:15px;text-align:center;font-family:var(--font);}
  .unit{font-size:11px;color:var(--text-3);font-weight:700;flex:0 0 auto;}
  .setdone{width:42px;height:42px;flex:0 0 auto;border-radius:10px;border:1px solid var(--border);background:var(--bg-3);color:var(--text-3);font-size:18px;font-weight:800;cursor:pointer;}
  .setdone.done{background:var(--accent);border-color:var(--accent);color:#fff;}
  .mini-timer{width:42px;height:42px;flex:0 0 auto;border-radius:10px;border:1px solid var(--border);background:var(--bg-3);color:var(--accent);font-size:14px;cursor:pointer;}
  .sx-foot{display:flex;justify-content:space-between;margin-top:4px;}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:6px 2px;font-family:var(--font);}
  .rest-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--text);color:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:60;max-width:94%;}
  .rest-time{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;min-width:104px;text-align:center;}
  .rest-adj{background:rgba(128,128,128,.28);border:none;color:inherit;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer;font-size:13px;}
  .rest-skip{background:var(--accent);border:none;color:#fff;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:13px;}
  .resume-banner,.repeat-banner{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;padding:14px 16px;border-radius:var(--radius);font-weight:800;font-size:14px;margin-bottom:14px;cursor:pointer;box-shadow:var(--shadow);}
  .repeat-banner{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .summary-stat{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);}
  .summary-stat:last-child{border-bottom:none;}
  .summary-stat .k{color:var(--text-2);font-weight:600;}
  .summary-stat .v{font-weight:800;font-size:16px;}
  .sw-display{font-size:58px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin-top:34px;color:var(--text);letter-spacing:1px;}
  .sw-lap{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;font-size:15px;}
  .sw-lap:last-child{border-bottom:none;}
  .sw-lap .n{color:var(--text-2);font-weight:700;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cal-nav{width:42px;height:42px;border-radius:11px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--text-3);padding:2px 0 6px;}
  .cal-cell{aspect-ratio:1;border-radius:11px;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:14px;font-weight:600;}
  .cal-cell.empty{background:transparent;border:none;cursor:default;}
  .cal-cell.today{border-color:var(--accent);border-width:2px;color:var(--accent);}
  .cal-cell:active:not(.empty){background:var(--bg-3);}
  .cal-cell .dots{display:flex;gap:3px;position:absolute;bottom:6px;}
  .cal-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .dot-done{background:#22c55e;}
  .dot-sched{background:var(--accent);}
  .dot-miss{background:#f43f5e;}
  .cal-legend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:11px;color:var(--text-2);font-weight:600;}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .planner-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
  .planner-row:last-child{border-bottom:none;}
  .bars{display:flex;gap:5px;align-items:flex-end;height:130px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0;}
  .bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;}
  .bar{width:100%;border-radius:6px 6px 0 0;min-height:2px;transition:height .3s;}
  .bar-lbl{font-size:9px;color:var(--text-3);margin-top:5px;white-space:nowrap;overflow:hidden;}
  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .hbar-label{width:80px;font-size:12px;font-weight:700;color:var(--text-2);flex:0 0 auto;}
  .hbar-track{flex:1;height:15px;background:var(--bg-3);border-radius:999px;overflow:hidden;}
  .hbar-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}
  .hbar-val{font-size:11px;color:var(--text-3);font-weight:700;width:30px;text-align:right;flex:0 0 auto;}
  .recov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .recov-tile{border-radius:12px;padding:12px;border:1px solid var(--border);}
  .recov-tile .rn{font-weight:700;font-size:13px;}
  .recov-tile .rd{font-size:11px;margin-top:3px;}
  .photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .photo-tile{position:relative;cursor:pointer;}
  .photo-tile img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:11px;display:block;}
  .photo-tile .ptime{position:absolute;bottom:5px;left:5px;right:5px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);}
  .compare{display:flex;gap:10px;}
  .compare>div{flex:1;min-width:0;}
  .compare img{width:100%;border-radius:12px;margin-top:8px;display:block;}
  .compare select{padding:8px;font-size:13px;min-height:40px;}
  .mform{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .mood-row{display:flex;gap:8px;}
  .mood-btn{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:26px;padding:10px 0;cursor:pointer;}
  .mood-btn.on{border-color:var(--accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent);}
  .scale-row{display:flex;gap:8px;}
  .scale-btn{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:16px;font-weight:800;padding:12px 0;cursor:pointer;color:var(--text);}
  .scale-btn.on{border-color:var(--accent);background:var(--accent);color:#fff;}
  .insight{border-left:3px solid var(--border);}
  .insight.warn{border-left-color:#f59e0b;}
  .insight.good{border-left-color:#22c55e;}
  .plate-chip{background:var(--bg-3);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;}
  .level-card{display:flex;align-items:center;gap:16px;}
  .level-badge{width:56px;height:56px;flex:0 0 auto;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ach{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center;opacity:.5;}
  .ach.got{opacity:1;border-color:var(--accent);}
  .ach-i{font-size:28px;}
  .ach-n{font-weight:700;font-size:13px;margin-top:6px;}
  .ach-d{font-size:11px;color:var(--text-2);margin-top:2px;}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;animation:fade .2s ease;padding:24px;}
  .celebrate-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s ease;}
  .celebrate-emoji{font-size:56px;animation:bounce .6s ease;}
  .celebrate-title{font-size:20px;font-weight:800;margin:8px 0;}
  .celebrate-line{font-size:15px;color:var(--text-2);margin:4px 0;font-weight:600;}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bounce{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>

/* ---------------- IndexedDB helper ---------------- */
const DB = (() => {
  const NAME='fittrack', VERSION=2; let db=null;
  function open(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(NAME,VERSION);
      req.onupgradeneeded=(e)=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv',{keyPath:'key'});
        if(!d.objectStoreNames.contains('exercises')){
          const s=d.createObjectStore('exercises',{keyPath:'id'});
          s.createIndex('muscle','muscle',{unique:false});
          s.createIndex('equipment','equipment',{unique:false});
          s.createIndex('difficulty','difficulty',{unique:false});
          s.createIndex('location','location',{unique:false});
        }
        if(!d.objectStoreNames.contains('workouts')) d.createObjectStore('workouts',{keyPath:'id'});
        if(!d.objectStoreNames.contains('plans')) d.createObjectStore('plans',{keyPath:'id'});
        if(!d.objectStoreNames.contains('sessions')){
          const s=d.createObjectStore('sessions',{keyPath:'id'}); s.createIndex('date','date',{unique:false});
        }
        if(!d.objectStoreNames.contains('bodyMetrics')){
          const s=d.createObjectStore('bodyMetrics',{keyPath:'id'}); s.createIndex('date','date',{unique:false});
        }
        if(!d.objectStoreNames.contains('nutrition')){
          const s=d.createObjectStore('nutrition',{keyPath:'id'}); s.createIndex('date','date',{unique:false});
        }
        if(!d.objectStoreNames.contains('recovery')){
          const s=d.createObjectStore('recovery',{keyPath:'id'}); s.createIndex('date','date',{unique:false});
        }
        if(!d.objectStoreNames.contains('photos')){
          const s=d.createObjectStore('photos',{keyPath:'id'}); s.createIndex('date','date',{unique:false});
        }
        if(!d.objectStoreNames.contains('schedule')){
          const s=d.createObjectStore('schedule',{keyPath:'id'}); s.createIndex('date','date',{unique:false});
        }
      };
      req.onsuccess=()=>{db=req.result;resolve(db);};
      req.onerror=()=>reject(req.error);
    });
  }
  function store(name,mode){return db.transaction(name,mode).objectStore(name);}
  function wrap(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  return {
    open,
    get:(s,k)=>wrap(store(s,'readonly').get(k)),
    getAll:(s)=>wrap(store(s,'readonly').getAll()),
    put:(s,v)=>wrap(store(s,'readwrite').put(v)),
    bulkPut:async(s,arr)=>{const os=store(s,'readwrite');arr.forEach(v=>os.put(v));return new Promise((res,rej)=>{os.transaction.oncomplete=()=>res();os.transaction.onerror=()=>rej(os.transaction.error);});},
    del:(s,k)=>wrap(store(s,'readwrite').delete(k)),
    clear:(s)=>wrap(store(s,'readwrite').clear()),
    count:(s)=>wrap(store(s,'readonly').count()),
    async getKV(key,fb){const r=await wrap(store('kv','readonly').get(key));return r?r.value:fb;},
    setKV(key,value){return wrap(store('kv','readwrite').put({key,value}));}
  };
})();

function highlightMuscles(container, primary, secondary){
  container.querySelectorAll('.m').forEach(el=>{el.classList.remove('hp','hs');});
  (secondary||[]).forEach(k=>container.querySelectorAll(`.m[data-k="${k}"]`).forEach(el=>el.classList.add('hs')));
  (primary||[]).forEach(k=>container.querySelectorAll(`.m[data-k="${k}"]`).forEach(el=>{el.classList.remove('hs');el.classList.add('hp');}));
}

/* ---------------- Router ---------------- */
const view=document.getElementById('view');
let CURRENT='home';
const VIEWS={home:renderHome,library:renderLibrary,workout:renderWorkout,progress:renderProgress,more:renderMore};
function setTab(tab){document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));}
function navigate(tab){
  if(typeof stopSessTimers==='function')stopSessTimers();
  if(typeof SW_INT!=='undefined'&&SW_INT){clearInterval(SW_INT);SW_INT=null;}
  CURRENT=tab; setTab(tab); view.scrollTop=0; view.innerHTML='';
  const el=document.createElement('div'); el.className='fade'; view.appendChild(el);
  VIEWS[tab](el);
}
function renderInto(fn){
  view.scrollTop=0; view.innerHTML='';
  const el=document.createElement('div'); el.className='fade'; view.appendChild(el); fn(el);
}

/* ---------- HOME ---------- */
async function renderHome(root){
  const streak=await DB.getKV('streak',0);
  const today=await DB.getKV('todayWorkout',null);
  const _sched=(await getSchedule()).filter(s=>s.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));

/* ---------- LIBRARY ---------- */
const LIB={q:'',muscle:'All',equipment:'All',difficulty:'All',location:'All',myGear:true};
const MUSCLE_GROUPS=['All','Chest','Back','Shoulders','Biceps','Triceps','Legs','Core','Forearms'];
const EQUIP=['All','Barbell','Dumbbell','Bodyweight','Grip','Machine','Cable'];
const DIFF=['All','Beginner','Intermediate','Advanced'];
const LOC=['All','Home','Gym'];
const TYPE_TABS=['Strength','Warmup','Cooldown'];
let LIB_TYPE='Strength';
let ALL_EXERCISES=[];

function diffBadge(d){const c=d==='Beginner'?'b':d==='Intermediate'?'i':'a';return `<span class="badge ${c}">${d[0]}</span>`;}

async function renderLibrary(root){
  if(ALL_EXERCISES.length===0) ALL_EXERCISES=((window.FT_EXERCISES&&window.FT_EXERCISES.length)?window.FT_EXERCISES:EXERCISE_SEED).slice();
  root.innerHTML=`
    <input class="search" id="libSearch" placeholder="Search exercises…" value="${LIB.q}">
    <div class="seg" style="margin-bottom:12px" id="typeTabs">
      ${TYPE_TABS.map(t=>`<button data-t="${t}" class="${LIB_TYPE===t?'on':''}">${t==='Warmup'?'Warm-up':t==='Cooldown'?'Cool-down':'Exercises'}</button>`).join('')}
    </div>
    <div class="filter-label">Muscle</div>
    <div class="chips" id="muscleChips">${MUSCLE_GROUPS.map(m=>`<div class="chip ${LIB.muscle===m?'on':''}" data-m="${m}">${m}</div>`).join('')}</div>
    <div class="filter-label">Equipment</div>
    <div class="chips" id="equipChips">${EQUIP.map(e=>`<div class="chip ${LIB.equipment===e?'on':''}" data-e="${e}">${e}</div>`).join('')}</div>
    <div class="filter-label">Difficulty · Location</div>
    <div class="chips" id="miscChips">
      ${DIFF.map(d=>`<div class="chip ${LIB.difficulty===d?'on':''}" data-d="${d}">${d}</div>`).join('')}
      ${LOC.filter(l=>l!=='All').map(l=>`<div class="chip ${LIB.location===l?'on':''}" data-l="${l}">${l}</div>`).join('')}
    </div>
    <div class="chips" style="margin-top:2px"><div class="chip ${LIB.myGear?'on':''}" id="myGearChip">🎒 My gear only</div></div>
    <div class="result-count" id="resCount"></div>
    <div id="exList"></div>`;

  const searchEl=root.querySelector('#libSearch');
  searchEl.addEventListener('input',e=>{LIB.q=e.target.value;drawList();});
  root.querySelector('#typeTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LIB_TYPE=b.dataset.t;renderLibrary(root);});
  root.querySelector('#muscleChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;LIB.muscle=c.dataset.m;markChips(root,'#muscleChips',c);drawList();});
  root.querySelector('#equipChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;LIB.equipment=c.dataset.e;markChips(root,'#equipChips',c);drawList();});
  root.querySelector('#miscChips').addEventListener('click',e=>{
    const c=e.target.closest('.chip');if(!c)return;
    if(c.dataset.d!==undefined){LIB.difficulty=c.dataset.d;root.querySelectorAll('#miscChips .chip[data-d]').forEach(x=>x.classList.toggle('on',x===c));}
    if(c.dataset.l!==undefined){LIB.location = (LIB.location===c.dataset.l)?'All':c.dataset.l;root.querySelectorAll('#miscChips .chip[data-l]').forEach(x=>x.classList.toggle('on',x.dataset.l===LIB.location));}
    drawList();
  });
  root.querySelector('#myGearChip').addEventListener('click',e=>{LIB.myGear=!LIB.myGear;e.target.classList.toggle('on',LIB.myGear);drawList();});

  function drawList(){
    const list=root.querySelector('#exList');
    const q=LIB.q.trim().toLowerCase();
    const items=ALL_EXERCISES.filter(x=>{
      if(x.type!==LIB_TYPE) return false;
      if(LIB.muscle!=='All' && x.muscle!==LIB.muscle) return false;
      if(LIB.equipment!=='All' && x.equipment!==LIB.equipment) return false;
      if(LIB.difficulty!=='All' && x.difficulty!==LIB.difficulty) return false;
      if(LIB.location!=='All' && !(x.location===LIB.location || x.location==='Both')) return false;
      if(LIB.myGear && !MY_EQUIPMENT.includes(x.equipment)) return false;
      if(q && !x.name.toLowerCase().includes(q) && !x.muscle.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=>a.name.localeCompare(b.name));
    root.querySelector('#resCount').textContent=`${items.length} exercise${items.length!==1?'s':''}`;
    if(items.length===0){list.innerHTML=`<div class="empty"><div class="ico">🔍</div><h3>No matches</h3><p class="muted">Try clearing a filter or searching a different term.</p></div>`;return;}
    list.innerHTML=items.map(x=>`
      <div class="ex-card" data-id="${x.id}">
        <div class="ex-thumb" data-thumb="${x.id}">${x.icon||'🏋️'}</div>
        <div class="ex-info">
          <div class="n">${x.name}${diffBadge(x.difficulty)}</div>
          <div class="m">${x.muscle} · ${x.equipment} · ${x.location}</div>
        </div>
        <span style="color:var(--text-3);font-size:20px">›</span>
      </div>`).join('');
    list.querySelectorAll('.ex-card').forEach(card=>card.addEventListener('click',()=>openExercise(card.dataset.id)));
    // load any custom images into thumbs
    items.forEach(async x=>{
      const img=await DB.getKV('eximg:'+x.id,null);
      if(img){const t=list.querySelector(`[data-thumb="${x.id}"]`);if(t)t.innerHTML=`<img src="${img}" alt="">`;}
    });
  }
  drawList();
}
function markChips(root,sel,active){root.querySelectorAll(sel+' .chip').forEach(x=>x.classList.toggle('on',x===active));}

/* ---------- EXERCISE DETAIL ---------- */
async function openExercise(id, back){
  if(!ALL_EXERCISES.length) ALL_EXERCISES=((window.FT_EXERCISES&&window.FT_EXERCISES.length)?window.FT_EXERCISES:EXERCISE_SEED).slice();
  const ex=ALL_EXERCISES.find(x=>x.id===id);
  const customImg=await DB.getKV('eximg:'+id,null);
  renderInto(root=>{
    const altHtml=ex.alts.map(name=>{
      const found=ALL_EXERCISES.find(e=>e.name===name);
      return `<span class="alt-chip ${found?'':'dead'}" ${found?`data-alt="${found.id}"`:''}>${name}</span>`;
    }).join('');
    root.innerHTML=`
      <div class="backbar"><button class="back-btn" id="back">‹</button><div class="detail-title">${ex.name}</div></div>
      <div class="meta-row">
        <span class="meta">${ex.muscle}</span><span class="meta">${ex.equipment}</span>
        <span class="meta">${ex.difficulty}</span><span class="meta">${ex.location}</span>
      </div>
      <div class="card"><p class="muted" style="margin:0">${ex.desc}</p></div>

      ${!MY_EQUIPMENT.includes(ex.equipment)?`<div class="card warn">
        <div class="warn-h">⚠️ You don't have ${ex.equipment}</div>
        <p class="muted" style="margin:6px 0 10px">Based on your equipment, try one of these instead:</p>
        <div>${(function(){
          const subs=ALL_EXERCISES.filter(e=>e.id!==ex.id && e.muscle===ex.muscle && MY_EQUIPMENT.includes(e.equipment)).slice(0,4);
          return subs.length?subs.map(s=>`<span class="alt-chip" data-alt="${s.id}">${s.name}</span>`).join(''):'<span class="tiny">Add more gear in Settings → My Equipment to see substitutes.</span>';
        })()}</div>
      </div>`:''}

      ${(ex.map&&ex.map.length)?`<div class="card">
        <h2>Muscles Worked</h2>
        <div class="bodymap" id="map">${bodyMapSVG()}</div>
        <div class="map-legend">
          <span><i class="dot" style="background:var(--accent)"></i> Primary</span>
          <span><i class="dot" style="background:var(--accent);opacity:.4"></i> Secondary</span>
        </div>
      </div>`:''}

      <button class="btn" id="doNow" style="margin-bottom:14px">▶ Start</button>

      <div class="card"><h2>How To Do It</h2><ol class="steps">${ex.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
      <div class="card"><h2>Common Mistakes</h2><ul class="mlist">${ex.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul></div>
      <div class="card"><h2>Alternatives & Substitutions</h2><div>${altHtml}</div></div>

      <div class="card">
        <h2>Your Image <span class="tiny">(optional, stored locally)</span></h2>
        <div class="img-slot" id="imgSlot">${customImg?`<img src="${customImg}" alt="">`:'📷 Tap to add your own reference image'}</div>
        <input type="file" id="imgInput" accept="image/*" style="display:none">
        ${customImg?`<div class="img-actions"><button class="btn secondary" id="imgReplace">Replace</button><button class="btn ghost" id="imgRemove">Remove</button></div>`:''}
      </div>`;
    root.querySelector('#back').addEventListener('click', back || (()=>navigate('library')) );
    root.querySelector('#doNow').addEventListener('click',async()=>{
      const reps=(ex.track==='time'?'30s':ex.track==='distance'?'30m':'10');
      if(SESSION){
        SESSION.queue.push({id:ex.id,mode:(ex.track||setMode(reps)),skipped:false,target:{sets:3,reps},sets:[0,0,0].map(()=>({weight:'',reps:'',duration:'',distance:'',done:false}))});
        await saveActive(); toast('Added to your workout'); renderSession();
      } else {
        startSession(ex.name,[{id:ex.id,sets:3,reps}]);
      }
    });
    const mapEl=root.querySelector('#map');
    if(mapEl) highlightMuscles(mapEl, ex.map, ex.mapSec);
    root.querySelectorAll('.alt-chip[data-alt]').forEach(c=>c.addEventListener('click',()=>openExercise(c.dataset.alt)));

    const input=root.querySelector('#imgInput');
    const slot=root.querySelector('#imgSlot');
    slot.addEventListener('click',()=>input.click());
    root.querySelector('#imgReplace')?.addEventListener('click',()=>input.click());
    root.querySelector('#imgRemove')?.addEventListener('click',async()=>{await DB.setKV('eximg:'+id,null);openExercise(id);});
    input.addEventListener('change',e=>{
      const file=e.target.files[0]; if(!file)return;
      const reader=new FileReader();
      reader.onload=async()=>{await DB.setKV('eximg:'+id,reader.result);openExercise(id);};
      reader.readAsDataURL(file);
    });
  });
}

function openGoals(){
  renderInto(root=>{
    root.innerHTML=`
      <div class="backbar"><button class="back-btn" id="back">‹</button><div class="detail-title">Your Goals</div></div>
      <p class="muted" style="margin:0 4px 16px">Pick one or more. These shape your recommendations in later phases.</p>

        ${GOALS.map(g=>`<div class="goal ${USER_GOALS.includes(g.id)?'on':''}" data-g="${g.id}"><div class="gi">${g.i}</div><div class="gn">${g.n}</div></div>`).join('')}
      </div>`;
    root.querySelector('#back').addEventListener('click',()=>navigate(CURRENT));
    root.querySelector('#goalGrid').addEventListener('click',async e=>{
      const g=e.target.closest('.goal');if(!g)return;
      const id=g.dataset.g;

/* ---------- WORKOUT / PROGRESS placeholders ---------- */
/* ---------- Phase 3: Plans, Workouts, Builder ---------- */
let WK={tab:'plans'};
let BUILDER=null;
let PICK={q:'',muscle:'All'};
let FAVORITES=[];

function exById(id){const src=(window.FT_EXERCISES&&window.FT_EXERCISES.length)?window.FT_EXERCISES:EXERCISE_SEED;return src.find(x=>x.id===id);}
function plansData(){return window.FT_PLANS||[];}
function fkey(planId,dayIdx){return 'plan:'+planId+':'+dayIdx;}
function planTags(p){return (p.goals||[]).map(g=>{const gg=GOALS.find(x=>x.id===g);return gg?gg.n:g;});}
function isFav(id){return FAVORITES.includes(id);}
async function toggleFav(id){if(FAVORITES.includes(id))FAVORITES=FAVORITES.filter(x=>x!==id);else FAVORITES.push(id);await DB.setKV('favorites',FAVORITES);}
async function getCustomWorkouts(){return (await DB.getAll('workouts'))||[];}
async function dupWorkout(name,ex){const w={id:'w'+Date.now(),name:name+' (copy)',exercises:ex.map(e=>({id:e.id,sets:e.sets,reps:e.reps})),created:Date.now()};await DB.put('workouts',w);return w;}
async function setToday(w){await DB.setKV('todayWorkout',w);}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},1900);}
function levelBadge(l){const c=l==='Beginner'?'b':l==='Intermediate'?'i':'a';return `<span class="badge ${c}">${l}</span>`;}

function renderWorkout(root){
  root.innerHTML=`
    <div class="hub-head">
      <div style="font-size:20px;font-weight:800">Workouts</div>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" style="width:auto;min-height:42px;padding:0 14px;font-size:18px" id="swBtn" title="Stopwatch">⏱</button>
        <button class="btn" style="width:auto;min-height:42px;padding:0 18px;font-size:14px" id="createBtn">＋ Create</button>
      </div>
    </div>
    ${sessionBannerHTML()}
    <div class="seg" style="margin-bottom:14px" id="wkTabs">
      <button data-t="plans" class="${WK.tab==='plans'?'on':''}">Plans</button>
      <button data-t="mine" class="${WK.tab==='mine'?'on':''}">My Workouts</button>
      <button data-t="favs" class="${WK.tab==='favs'?'on':''}">Favorites</button>
    </div>
    <div id="wkBody"></div>`;
  root.querySelector('#createBtn').addEventListener('click',()=>openBuilder());
  root.querySelector('#swBtn').addEventListener('click',()=>openStopwatch());
  root.querySelector('#wkTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;WK.tab=b.dataset.t;renderWorkout(root);});

function drawPlans(body){
  body.innerHTML=plansData().map(p=>`
    <div class="plan-card" data-p="${p.id}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="n">${p.name} ${levelBadge(p.level)}</div>
        <span style="color:var(--text-3);font-size:20px">›</span>
      </div>
      <div class="muted" style="margin:6px 0 8px">${p.desc}</div>
      <div class="tiny">${p.days.length} day${p.days.length>1?'s':''} · ${p.location} · ${planTags(p).slice(0,2).join(', ')}</div>
    </div>`).join('');
  body.querySelectorAll('.plan-card').forEach(c=>c.addEventListener('click',()=>openPlan(c.dataset.p)));
}

function openPlan(planId){
  const p=plansData().find(x=>x.id===planId);
  renderInto(root=>{
    root.innerHTML=`
      <div class="backbar"><button class="back-btn" id="back">‹</button><div class="detail-title">${p.name}</div></div>
      <div class="meta-row"><span class="meta">${p.level}</span><span class="meta">${p.location}</span>${planTags(p).map(t=>`<span class="meta">${t}</span>`).join('')}</div>
      <div class="card"><p class="muted" style="margin:0">${p.desc}</p></div>
      <div class="section-title">Days</div>
      ${p.days.map((d,i)=>{const groups=[...new Set(d.ex.map(e=>{const x=exById(e.id);return x?x.muscle:'';}))].filter(Boolean).slice(0,3).join(', ');return `<div class="day-card" data-d="${i}">
        <div><div class="n">${d.name}</div><div class="muted" style="margin-top:3px">${d.ex.length} exercises · ${groups}</div></div>
        <span style="color:var(--text-3);font-size:20px">›</span>
      </div>`;}).join('')}`;
    root.querySelector('#back').addEventListener('click',()=>navigate('workout'));
    root.querySelectorAll('.day-card').forEach(c=>c.addEventListener('click',()=>openDay(planId,+c.dataset.d)));
  });
}

function openDay(planId,dayIdx){
  const p=plansData().find(x=>x.id===planId);const d=p.days[dayIdx];const key=fkey(planId,dayIdx);
  renderInto(root=>{
    root.innerHTML=`
      <div class="backbar"><button class="back-btn" id="back">‹</button><div class="detail-title">${p.name} · ${d.name}</div></div>
      <div class="card" style="padding:6px 0">
        ${d.ex.map(e=>{const x=exById(e.id);return `<div class="wk-ex" data-id="${e.id}"><div class="ex-thumb">${x?x.icon:'🏋️'}</div><div class="ex-info"><div class="n">${x?x.name:e.id}</div><div class="m">${x?x.muscle:''}</div></div><div class="sr">${e.sets}×${e.reps}</div></div>`;}).join('')}
      </div>
      <div class="tiny" style="text-align:center;margin:2px 0 10px">Estimated ~${estDuration(d.ex)} min · ${d.ex.length} exercises</div>
      <button class="btn" id="startBtn">▶ Start Workout</button>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn secondary" id="dupBtn">⧉ Duplicate</button>
        <button class="btn ghost" id="favBtn">${isFav(key)?'★ Favorited':'☆ Favorite'}</button>
      </div>`;
    root.querySelector('#back').addEventListener('click',()=>openPlan(planId));
    root.querySelectorAll('.wk-ex').forEach(c=>c.addEventListener('click',()=>openExercise(c.dataset.id,()=>openDay(planId,dayIdx))));
    root.querySelector('#startBtn').addEventListener('click',()=>startSession(p.name+' · '+d.name,d.ex));
    root.querySelector('#dupBtn').addEventListener('click',async()=>{await dupWorkout(p.name+' '+d.name,d.ex);toast('Copied to My Workouts');});
    const fb=root.querySelector('#favBtn');
    fb.addEventListener('click',async()=>{await toggleFav(key);fb.textContent=isFav(key)?'★ Favorited':'☆ Favorite';});
  });
}

async function drawMine(body){
  const list=await getCustomWorkouts();
  if(!list.length){body.innerHTML=`<div class="empty"><div class="ico">📝</div><h3>No custom workouts yet</h3><p class="muted">Tap Create to build your own from your 142-exercise library.</p></div>`;return;}
  body.innerHTML=list.sort((a,b)=>b.created-a.created).map(w=>`
    <div class="plan-card" data-w="${w.id}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="n">${isFav(w.id)?'★ ':''}${w.name}</div><span style="color:var(--text-3);font-size:20px">›</span>
      </div>
      <div class="muted" style="margin-top:6px">${w.exercises.length} exercises · custom</div>
    </div>`).join('');
  body.querySelectorAll('.plan-card').forEach(c=>c.addEventListener('click',()=>openWorkout(c.dataset.w)));
}

async function drawFavs(body){
  const custom=await getCustomWorkouts();
  const favCustom=custom.filter(w=>isFav(w.id));

/* ================= Phase 4: Live Workout Tracking ================= */
let SESSION=null, LAST_SESSION=null, SESS_INT=null, REST_INT=null, REST=null, MINI=null, BODY_WEIGHT_KG=70;

function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;const mm=h?String(m).padStart(2,'0'):String(m);return (h?h+':':'')+mm+':'+String(ss).padStart(2,'0');}
function unitLabel(){return (typeof SETTINGS!=='undefined'&&SETTINGS.units==='lb')?'lb':'kg';}
function setMode(targetReps){const r=String(targetReps||'').toLowerCase();if(/\d\s*m\b/.test(r)||/\bm\b/.test(r))return 'distance';if(r.includes('s'))return 'time';return 'reps';}
function estDuration(exList){let sets=0;(exList||[]).forEach(e=>sets+=parseInt(e.sets)||0);return Math.max(5,Math.round(sets*2.5/5)*5);}
function saveActive(){return DB.setKV('activeSession',SESSION);}
function stopSessTimers(){if(SESS_INT){clearInterval(SESS_INT);SESS_INT=null;}if(REST_INT){clearInterval(REST_INT);REST_INT=null;}if(MINI){clearInterval(MINI.int);MINI=null;}REST=null;}

async function startSession(name, exList){
  SESSION={name,startTs:Date.now(),restDur:90,
    queue:(exList||[]).map(e=>{const _x=exById(e.id);const mode=(_x&&_x.track)?_x.track:setMode(e.reps);const n=parseInt(e.sets)||3;const sets=[];for(let i=0;i<n;i++)sets.push({weight:'',reps:'',duration:'',distance:'',done:false});return {id:e.id,mode,skipped:false,target:{sets:n,reps:e.reps},sets};})};
  await saveActive();
  await DB.setKV('todayWorkout',{name,ex:exList});
  renderSession();
}

function sessionStats(){
  let done=0,total=0,vol=0;
  SESSION.queue.forEach(q=>{if(q.skipped)return;q.sets.forEach(s=>{total++;if(s.done){done++;const w=parseFloat(s.weight)||0,r=parseFloat(s.reps)||0;vol+=w*r;}});});
  return {completedSets:done,totalSets:total,pct:total?Math.round(done/total*100):0,volume:vol};
}

function setRowHTML(qi,si,s,mode){
  const done=s.done?'done':'';
  if(mode==='time') return `<div class="logrow ${done}"><span class="setno">${si+1}</span><input class="log-input" inputmode="numeric" data-q="${qi}" data-s="${si}" data-f="duration" value="${s.duration||''}" placeholder="sec"><span class="unit">s</span><button class="mini-timer" data-q="${qi}" data-s="${si}">▶</button><button class="setdone ${done}" data-q="${qi}" data-s="${si}">✓</button></div>`;
  if(mode==='distance') return `<div class="logrow ${done}"><span class="setno">${si+1}</span><input class="log-input" inputmode="numeric" data-q="${qi}" data-s="${si}" data-f="distance" value="${s.distance||''}" placeholder="dist"><span class="unit">m</span><button class="setdone ${done}" data-q="${qi}" data-s="${si}">✓</button></div>`;
  return `<div class="logrow ${done}"><span class="setno">${si+1}</span><input class="log-input" inputmode="decimal" data-q="${qi}" data-s="${si}" data-f="weight" value="${s.weight||''}" placeholder="0"><span class="unit">${unitLabel()}</span><input class="log-input" inputmode="numeric" data-q="${qi}" data-s="${si}" data-f="reps" value="${s.reps||''}" placeholder="reps"><span class="unit">reps</span><button class="setdone ${done}" data-q="${qi}" data-s="${si}">✓</button></div>`;
}
function exCardHTML(q,qi){
  const x=exById(q.id);const dc=q.sets.filter(s=>s.done).length;
  return `<div class="sx-card ${q.skipped?'skipped':''}" data-qi="${qi}">
    <div class="sx-head">
      <div class="ex-thumb">${x?x.icon:'🏋️'}</div>
      <div style="flex:1;min-width:0" data-open="${q.id}"><div class="n">${x?x.name:q.id}</div><div class="m">${x?x.muscle:''} · target ${q.target.sets}×${q.target.reps}</div></div>
      <div class="sx-count">${dc}/${q.sets.length}</div>
    </div>
    <div class="sx-sets">${q.sets.map((s,si)=>setRowHTML(qi,si,s,q.mode)).join('')}</div>
    <div class="sx-foot"><button class="linkbtn" data-add="${qi}">＋ Add set</button><button class="linkbtn" data-skip="${qi}">${q.skipped?'Unskip':'Skip'}</button></div>
  </div>`;
}

function renderSession(){
  if(!SESSION){navigate('workout');return;}
  stopSessTimers();
  CURRENT='workout'; setTab('workout');
  view.scrollTop=0; view.innerHTML='';
  const root=document.createElement('div'); root.className='fade'; view.appendChild(root);
  const st=sessionStats();
  root.innerHTML=`
    <div class="sess-head">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="detail-title" style="font-size:17px">${SESSION.name}</div>
        <div class="sess-timer" id="sessTimer">0:00</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:${st.pct}%"></div></div>
      <div class="tiny" id="progText" style="margin-top:6px">${st.completedSets}/${st.totalSets} sets · ${st.pct}%</div>
    </div>
    <div id="sxList">${SESSION.queue.map((q,qi)=>exCardHTML(q,qi)).join('')}</div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn" id="finishBtn">✓ Finish</button>
      <button class="btn ghost" id="discardBtn" style="color:#f43f5e;flex:0 0 40%">Discard</button>
    </div>
    <div style="height:70px"></div>
    <div id="restBar"></div>`;
  wireSession(root);
  startSessTimer();
  renderRest();
}
function renderSessionList(){const el=document.getElementById('sxList');if(el)el.innerHTML=SESSION.queue.map((q,qi)=>exCardHTML(q,qi)).join('');}
function refreshStats(){const st=sessionStats();const f=document.getElementById('progFill');const t=document.getElementById('progText');if(f)f.style.width=st.pct+'%';if(t)t.textContent=`${st.completedSets}/${st.totalSets} sets · ${st.pct}%`;}
function updateCount(qi){const el=document.querySelector('.sx-card[data-qi="'+qi+'"] .sx-count');if(el){const q=SESSION.queue[qi];el.textContent=q.sets.filter(s=>s.done).length+'/'+q.sets.length;}}

function wireSession(root){
  root.querySelector('#finishBtn').addEventListener('click',finishSession);
  root.querySelector('#discardBtn').addEventListener('click',discardSession);
  const list=root.querySelector('#sxList');
  list.addEventListener('input',e=>{const inp=e.target.closest('.log-input');if(!inp)return;SESSION.queue[+inp.dataset.q].sets[+inp.dataset.s][inp.dataset.f]=inp.value;saveActive();refreshStats();});
  list.addEventListener('click',e=>{
    const done=e.target.closest('.setdone');
    if(done){const q=+done.dataset.q,s=+done.dataset.s,set=SESSION.queue[q].sets[s];set.done=!set.done;saveActive();done.classList.toggle('done',set.done);done.closest('.logrow').classList.toggle('done',set.done);updateCount(q);refreshStats();if(set.done)startRest(SESSION.restDur);return;}
    const add=e.target.closest('[data-add]');
    if(add){const q=+add.dataset.add,arr=SESSION.queue[q].sets,last=arr[arr.length-1];arr.push({weight:last?last.weight:'',reps:'',duration:'',distance:'',done:false});saveActive();renderSessionList();return;}
    const skip=e.target.closest('[data-skip]');
    if(skip){const q=+skip.dataset.skip,item=SESSION.queue[q];item.skipped=!item.skipped;if(item.skipped){SESSION.queue.splice(q,1);SESSION.queue.push(item);}saveActive();renderSessionList();refreshStats();return;}
    const mt=e.target.closest('.mini-timer');
    if(mt){toggleMiniTimer(mt);return;}
    const open=e.target.closest('[data-open]');
    if(open){openExercise(open.dataset.open,()=>renderSession());return;}
  });
}

function startSessTimer(){
  clearInterval(SESS_INT);
  const upd=()=>{const el=document.getElementById('sessTimer');if(!el){clearInterval(SESS_INT);SESS_INT=null;return;}el.textContent=fmtTime((Date.now()-SESSION.startTs)/1000);};
  upd();SESS_INT=setInterval(upd,1000);
}
function toggleMiniTimer(btn){
  const q=+btn.dataset.q,s=+btn.dataset.s,input=btn.parentElement.querySelector('.log-input');
  if(MINI&&MINI.btn===btn){clearInterval(MINI.int);btn.textContent='▶';MINI=null;return;}
  if(MINI){clearInterval(MINI.int);MINI.btn.textContent='▶';}
  let sec=parseInt(input.value)||0;btn.textContent='⏸';
  MINI={btn,int:setInterval(()=>{sec++;input.value=sec;SESSION.queue[q].sets[s].duration=sec;saveActive();},1000)};
}

function startRest(sec){clearInterval(REST_INT);REST={remaining:sec};renderRest();REST_INT=setInterval(()=>{if(!REST){clearInterval(REST_INT);return;}REST.remaining--;if(REST.remaining<=0){clearInterval(REST_INT);REST_INT=null;REST=null;renderRest();toast('Rest over — next set');}else renderRest();},1000);}
function renderRest(){
  const bar=document.getElementById('restBar');if(!bar)return;
  if(!REST){bar.innerHTML='';return;}
  bar.innerHTML=`<div class="rest-bar"><button class="rest-adj" id="rMinus">−15</button><div class="rest-time">Rest ${fmtTime(REST.remaining)}</div><button class="rest-adj" id="rPlus">+15</button><button class="rest-skip" id="rSkip">Skip</button></div>`;
  bar.querySelector('#rMinus').onclick=()=>{REST.remaining=Math.max(1,REST.remaining-15);renderRest();};
  bar.querySelector('#rPlus').onclick=()=>{REST.remaining+=15;renderRest();};
  bar.querySelector('#rSkip').onclick=()=>{clearInterval(REST_INT);REST_INT=null;REST=null;renderRest();};
}

async function updateStreak(){
  const todayStr=new Date().toISOString().slice(0,10);
  const last=await DB.getKV('lastWorkoutDate',null);
  if(last===todayStr)return;
  let streak=await DB.getKV('streak',0);
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  streak=(last===y)?streak+1:1;
  await DB.setKV('streak',streak);
  await DB.setKV('lastWorkoutDate',todayStr);
}
async function finishSession(){
  const st=sessionStats();
  if(!confirm('Finish and save this workout?'))return;
  const durationSec=Math.floor((Date.now()-SESSION.startTs)/1000);
  const calories=Math.round(5.0*3.5*BODY_WEIGHT_KG/200*(durationSec/60));
  const todayStr=new Date().toISOString().slice(0,10);
  const rec={id:'s'+Date.now(),ts:Date.now(),date:todayStr,name:SESSION.name,durationSec,completedSets:st.completedSets,totalSets:st.totalSets,totalVolume:Math.round(st.volume),calories,
    exercises:SESSION.queue.map(q=>({id:q.id,skipped:q.skipped,target:q.target,sets:q.sets.map(s=>({weight:s.weight,reps:s.reps,duration:s.duration,distance:s.distance,done:s.done}))}))};
  await DB.put('sessions',rec);
  const lastObj={name:SESSION.name,ex:SESSION.queue.map(q=>({id:q.id,sets:q.target.sets,reps:q.target.reps}))};
  await DB.setKV('lastSession',lastObj);LAST_SESSION=lastObj;
  await updateStreak();
  await DB.setKV('activeSession',null);SESSION=null;stopSessTimers();
  sessionSummary(rec);
}
async function discardSession(){
  if(!confirm('Discard this workout? Nothing will be saved.'))return;
  await DB.setKV('activeSession',null);SESSION=null;stopSessTimers();navigate('workout');
}

/* ---------- Standalone Stopwatch ---------- */
let SW={running:false,elapsed:0,startTs:0,laps:[]}, SW_INT=null;
function swFmt(ms){const t=Math.floor(ms/100),d=t%10,s=Math.floor(t/10),m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0')+'.'+d;}
function swTick(){const el=document.getElementById('swTime');if(!el){clearInterval(SW_INT);SW_INT=null;return;}el.textContent=swFmt(SW.running?(Date.now()-SW.startTs):SW.elapsed);}
function swStartTimer(){clearInterval(SW_INT);SW_INT=setInterval(swTick,80);swTick();}
function openStopwatch(){
  renderInto(root=>{
    root.innerHTML=`
      <div class="backbar"><button class="back-btn" id="back">‹</button><div class="detail-title">Stopwatch</div></div>
      <div class="sw-display" id="swTime">0:00.0</div>
      <div style="display:flex;gap:10px;margin-top:24px">
        <button class="btn" id="swStart">${SW.running?'Pause':'Start'}</button>
        <button class="btn secondary" id="swLap" style="flex:0 0 30%">Lap</button>
        <button class="btn ghost" id="swReset" style="flex:0 0 30%">Reset</button>
      </div>
      <div id="swLaps" style="margin-top:18px"></div>`;
    const startBtn=root.querySelector('#swStart');
    root.querySelector('#back').addEventListener('click',()=>{clearInterval(SW_INT);SW_INT=null;navigate('workout');});
    startBtn.addEventListener('click',()=>{
      if(SW.running){SW.elapsed=Date.now()-SW.startTs;SW.running=false;clearInterval(SW_INT);SW_INT=null;startBtn.textContent='Start';swTick();}
      else{SW.startTs=Date.now()-SW.elapsed;SW.running=true;startBtn.textContent='Pause';swStartTimer();}
    });
    root.querySelector('#swLap').addEventListener('click',()=>{const ms=SW.running?(Date.now()-SW.startTs):SW.elapsed;if(ms>0){SW.laps.unshift(ms);drawLaps(root);}});
    root.querySelector('#swReset').addEventListener('click',()=>{SW.running=false;SW.elapsed=0;SW.laps=[];clearInterval(SW_INT);SW_INT=null;startBtn.textContent='Start';swTick();drawLaps(root);});
    drawLaps(root);
    if(SW.running)swStartTimer(); else swTick();
  });
}
function drawLaps(root){
  const el=root.querySelector('#swLaps');if(!el)return;
  if(!SW.laps.length){el.innerHTML='';return;}
  const n=SW.laps.length;
  el.innerHTML=SW.laps.map((ms,i)=>`<div class="sw-lap"><span class="n">Lap ${n-i}</span><span>${swFmt(ms)}</span></div>`).join('');
}

/* ================= Phase 5: Calendar & Scheduling ================= */
let CAL={y:new Date().getFullYear(),m:new Date().getMonth()};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function pad2(n){return String(n).padStart(2,'0');}
function dstr(y,m,d){return y+'-'+pad2(m+1)+'-'+pad2(d);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDateShort(ds){const p=ds.split('-');const dt=new Date(+p[0],+p[1]-1,+p[2]);return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtDateLong(ds){const p=ds.split('-');const dt=new Date(+p[0],+p[1]-1,+p[2]);return dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});}

async function getSchedule(){try{return (await DB.getAll('schedule'))||[];}catch(e){return [];}}
async function workoutOptions(){
  const opts=[];
  plansData().forEach(p=>p.days.forEach((d,i)=>opts.push({ref:{type:'plan',planId:p.id,dayIdx:i},name:p.name+' · '+d.name})));
  (await getCustomWorkouts()).forEach(w=>opts.push({ref:{type:'custom',workoutId:w.id},name:w.name}));
  return opts;
}
async function resolveRef(ref){
  if(ref.type==='plan'){const p=plansData().find(x=>x.id===ref.planId);if(!p||!p.days[ref.dayIdx])return null;const d=p.days[ref.dayIdx];return {name:p.name+' · '+d.name,ex:d.ex};}
  const w=await DB.get('workouts',ref.workoutId);if(!w)return null;return {name:w.name,ex:w.exercises};
}

async function scheduleNotif(item){
  try{
    if(!(typeof SETTINGS!=='undefined'&&SETTINGS.notifications))return null;
    const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
    if(LN&&item.time){
      await LN.requestPermissions();
      const p=item.date.split('-');const t=item.time.split(':');
      const at=new Date(+p[0],+p[1]-1,+p[2],+t[0],+t[1],0,0);
      if(at.getTime()>Date.now()){
        const id=Math.floor(Math.random()*2000000000);
        await LN.schedule({notifications:[{id,title:'Workout reminder',body:item.name,schedule:{at}}]});
        return id;
      }
    }
  }catch(e){console.warn('notif schedule failed',e);}
  return null;
}
async function cancelNotif(id){try{const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;if(id&&LN)await LN.cancel({notifications:[{id}]});}catch(e){}}

function openCalendar(){
  const backTab=CURRENT;
  renderInto(async root=>{
    root.innerHTML=`<div class="backbar"><button class="back-btn" id="back">‹</button><div class="detail-title">Calendar</div></div><div id="calWrap"><p class="muted" style="text-align:center;padding:20px">Loading…</p></div>`;
    root.querySelector('#back').addEventListener('click',()=>navigate(backTab));
    await drawCalendar(root.querySelector('#calWrap'));
  });
}

async function drawCalendar(wrap){
  const sessions=(await DB.getAll('sessions'))||[];
  const schedule=await getSchedule();
  const sessionDates={};sessions.forEach(s=>{sessionDates[s.date]=(sessionDates[s.date]||0)+1;});
  const schByDate={};schedule.forEach(s=>{(schByDate[s.date]=schByDate[s.date]||[]).push(s);});
  const y=CAL.y,m=CAL.m,ts=todayStr();
  const first=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const monthName=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let doneCount=0,schedCount=0;
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=dstr(y,m,d);
    const done=sessionDates[ds]>0;const sched=(schByDate[ds]||[]).length>0;
    const missed=sched&&ds<ts&&!done;
    if(done)doneCount++; if(sched&&ds>=ts)schedCount++;
    let dots='';
    if(done)dots+='<span class="cal-dot dot-done"></span>';
    if(sched&&!done)dots+=`<span class="cal-dot ${missed?'dot-miss':'dot-sched'}"></span>`;
    cells+=`<div class="cal-cell ${ds===ts?'today':''}" data-d="${ds}"><span>${d}</span><span class="dots">${dots}</span></div>`;
  }
  wrap.innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" id="prevM">‹</button>
      <div style="font-weight:800;font-size:17px">${monthName}</div>
      <button class="cal-nav" id="nextM">›</button>
    </div>
    <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="cal-legend">
      <span><i class="cal-dot dot-done"></i> Done</span>
      <span><i class="cal-dot dot-sched"></i> Scheduled</span>
      <span><i class="cal-dot dot-miss"></i> Missed</span>
    </div>
    <div class="stat-row" style="margin-top:16px">
      <div class="stat"><div class="num">${doneCount}</div><div class="lbl">Done this month</div></div>
      <div class="stat"><div class="num">${schedCount}</div><div class="lbl">Upcoming</div></div>
    </div>
    <button class="btn secondary" id="plannerBtn">🗓 Weekly Planner</button>`;
  wrap.querySelector('#prevM').addEventListener('click',()=>{CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--;}drawCalendar(wrap);});
  wrap.querySelector('#nextM').addEventListener('click',()=>{CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++;}drawCalendar(wrap);});
  wrap.querySelectorAll('.cal-cell[data-d]').forEach(c=>c.addEventListener('click',()=>openCalDay(c.dataset.d)));
  wrap.querySelector('#plannerBtn').addEventListener('click',openPlanner);
}

      <div class="backbar"><button class="back-btn" id="back">‹</button><div class="detail-title" style="font-size:16px">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dayIdx]}</div></div>

      ${opts.map((o,i)=>`<div class="ex-card" data-i="${i}"><div class="ex-thumb">🏋️</div><div class="ex-info"><div class="n">${o.name}</div><div class="m">${o.ref.type==='plan'?'Plan workout':'Custom'}</div></div><span style="color:var(--accent);font-size:22px">＋</span></div>`).join('')}`;

async function applyPlanner(){
  const planner=await DB.getKV('weeklyPlanner',{});
  if(!Object.keys(planner).length){toast('Set at least one day first');return;}
  const opts=await workoutOptions();
  const existing=await getSchedule();
  const y=CAL.y,m=CAL.m,dim=new Date(y,m+1,0).getDate(),ts=todayStr();
  let added=0;
  for(let d=1;d<=dim;d++){
    const ds=dstr(y,m,d);if(ds<ts)continue;
    const wd=new Date(y,m,d).getDay();const ref=planner[wd];if(!ref)continue;
    if(existing.some(s=>s.date===ds))continue;
    const o=opts.find(o=>JSON.stringify(o.ref)===JSON.stringify(ref));if(!o)continue;
    await DB.put('schedule',{id:'sch'+Date.now()+Math.floor(Math.random()*10000)+d,date:ds,ref,name:o.name,time:null,notifId:null});
    added++;
  }
  toast(added?('Added '+added+' workouts'):'Nothing to add');
  openCalendar();
}

/* ================= Phase 6: Progress & Charts ================= */
let PROG={tab:'overview'};
const MUSCLE_LIST=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Core','Forearms'];

function weekStart(ts){const d=new Date(ts);const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d.getTime();}
function sessionMuscleSets(s){const m={};(s.exercises||[]).forEach(ex=>{const x=exById(ex.id);if(!x)return;const done=(ex.sets||[]).filter(st=>st.done).length;if(!done)return;m[x.muscle]=(m[x.muscle]||0)+done;});return m;}
function sessionVolume(s){return s.totalVolume||0;}

function htmlBars(items,opts){
  opts=opts||{};const color=opts.color||'var(--accent)';
  const max=Math.max(1,...items.map(i=>i.value));
  return `<div class="bars">${items.map(i=>`<div class="bar-col"><div class="bar-wrap"><div class="bar" title="${i.value}${opts.unit||''}" style="height:${Math.max(2,Math.round(i.value/max*100))}%;background:${i.value?color:'var(--bg-3)'}"></div></div><div class="bar-lbl">${i.label}</div></div>`).join('')}</div>`;
}
function svgLine(values,color){
  color=color||'var(--accent)';
  if(values.filter(v=>v>0).length<2)return `<p class="muted" style="text-align:center;padding:18px 0">Complete a couple more workouts to see this trend.</p>`;
  const w=320,h=120,pad=8,max=Math.max(...values),min=Math.min(...values),range=(max-min)||1;
  const pts=values.map((v,i)=>{const x=pad+(values.length===1?0:i/(values.length-1))*(w-2*pad);const y=h-pad-((v-min)/range)*(h-2*pad);return [x,y];});
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=pad+','+(h-pad)+' '+line+' '+(w-pad)+','+(h-pad);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:auto;display:block">
    <polyline points="${area}" fill="${color}" opacity="0.12"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${color}"/>`).join('')}
  </svg>`;
}
function recovStyle(days){
  if(days===null)return {bg:'var(--bg-3)',txt:'var(--text-3)',label:'Not trained yet'};
  if(days<=0)return {bg:'rgba(244,63,94,.16)',txt:'#f43f5e',label:'Trained today'};
  if(days===1)return {bg:'rgba(245,158,11,.16)',txt:'#f59e0b',label:'1 day ago'};
  if(days===2)return {bg:'rgba(245,158,11,.12)',txt:'#f59e0b',label:'2 days ago'};
  return {bg:'rgba(34,197,94,.15)',txt:'#22c55e',label:days+' days ago · recovered'};
}

function progOverview(body,sessions,streak){
  const totalVol=sessions.reduce((a,s)=>a+sessionVolume(s),0);
  const ws=weekStart(Date.now());
  const thisWeek=sessions.filter(s=>weekStart(s.ts)===ws).length;
  const avgMin=Math.round(sessions.reduce((a,s)=>a+s.durationSec,0)/sessions.length/60);
  // consistency: last 12 weeks
  const weeks=[];for(let i=11;i>=0;i--){const wsi=ws-i*604800000;weeks.push({ts:wsi,value:sessions.filter(s=>weekStart(s.ts)===wsi).length,label:new Date(wsi).getDate()});}
  // last 12 sessions
  const recent=sessions.slice(-12);
  const volSeries=recent.map(s=>sessionVolume(s));
  const durBars=recent.map((s,i)=>({label:'',value:Math.round(s.durationSec/60)}));
  // monthly last 6
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i,1);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push({key,label:d.toLocaleDateString(undefined,{month:'short'}),value:sessions.filter(s=>s.date.slice(0,7)===key).length});}
  body.innerHTML=`
    <div class="stat-row"><div class="stat"><div class="num">${sessions.length}</div><div class="lbl">Workouts</div></div>
      <div class="stat"><div class="num">${streak}</div><div class="lbl">Day Streak</div></div>
      <div class="stat"><div class="num">${thisWeek}</div><div class="lbl">This Week</div></div></div>
    <div class="stat-row"><div class="stat"><div class="num">${(totalVol/1000).toFixed(1)}k</div><div class="lbl">Total Volume ${unitLabel()}</div></div>
      <div class="stat"><div class="num">${avgMin}</div><div class="lbl">Avg Min</div></div></div>
    <div class="card"><h2>Consistency · last 12 weeks</h2>${htmlBars(weeks,{unit:' workouts'})}</div>
    <div class="card"><h2>Volume progression · last ${recent.length}</h2>${svgLine(volSeries)}</div>
    <div class="card"><h2>Workout duration · last ${recent.length}</h2>${htmlBars(durBars,{unit:' min'})}</div>
    <div class="card"><h2>Monthly workouts</h2>${htmlBars(months)}</div>`;
}

function progMuscles(body,sessions){
  const cutoff=Date.now()-30*86400000;
  const recent=sessions.filter(s=>s.ts>=cutoff);
  const bal={};MUSCLE_LIST.forEach(m=>bal[m]=0);
  recent.forEach(s=>{const ms=sessionMuscleSets(s);for(const k in ms)if(bal[k]!==undefined)bal[k]+=ms[k];});
  const balItems=Object.entries(bal).sort((a,b)=>b[1]-a[1]);
  const maxBal=Math.max(1,...balItems.map(x=>x[1]));
  // recovery
  const lastTrained={};MUSCLE_LIST.forEach(m=>lastTrained[m]=null);
  sessions.forEach(s=>{const ms=sessionMuscleSets(s);for(const k in ms){if(lastTrained[k]===null||s.ts>lastTrained[k])lastTrained[k]=s.ts;}});
  const now=Date.now();
  // frequency
  const freq={};sessions.forEach(s=>{const seen={};(s.exercises||[]).forEach(ex=>{if((ex.sets||[]).some(st=>st.done)&&!seen[ex.id]){seen[ex.id]=1;freq[ex.id]=(freq[ex.id]||0)+1;}});});
  const freqItems=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10);
  body.innerHTML=`
    <div class="card"><h2>Muscle balance · last 30 days</h2>
      ${balItems.every(x=>x[1]===0)?`<p class="muted">No sets logged in the last 30 days.</p>`:balItems.map(([m,v])=>`<div class="hbar-row"><div class="hbar-label">${m}</div><div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(v/maxBal*100)}%"></div></div><div class="hbar-val">${v}</div></div>`).join('')}
      <p class="tiny" style="margin-top:8px">Sets per muscle group — spot which areas lag behind.</p>
    </div>
    <div class="card"><h2>Recovery heatmap</h2>
      <div class="recov-grid">${MUSCLE_LIST.map(m=>{const lt=lastTrained[m];const days=lt===null?null:Math.floor((now-lt)/86400000);const st=recovStyle(days);return `<div class="recov-tile" style="background:${st.bg}"><div class="rn" style="color:${st.txt}">${m}</div><div class="rd" style="color:${st.txt}">${st.label}</div></div>`;}).join('')}</div>
      <p class="tiny" style="margin-top:10px">🔴 just trained · 🟠 recovering · 🟢 recovered</p>
    </div>
    <div class="card"><h2>Most frequent exercises</h2>
      <div id="freqList">${freqItems.map(([id,c])=>{const x=exById(id);return `<div class="set-row tap" data-ex="${id}"><div><div class="label">${x?x.name:id}</div><div class="sub">${x?x.muscle:''}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge">${c}×</span><span class="chev">›</span></div></div>`;}).join('')}</div>
      <p class="tiny" style="margin-top:8px">Tap an exercise for its weight & volume progression.</p>
    </div>`;
  body.querySelectorAll('#freqList [data-ex]').forEach(r=>r.addEventListener('click',()=>openExProgress(r.dataset.ex)));
}

let BM={tab:'metrics'};
function log10(x){return Math.log(x)/Math.LN10;}
function toKg(v){return (typeof SETTINGS!=='undefined'&&SETTINGS.units==='lb')?v/2.20462:v;}
function fromKg(kg){return (typeof SETTINGS!=='undefined'&&SETTINGS.units==='lb')?kg*2.20462:kg;}
function wUnit(){return (typeof SETTINGS!=='undefined'&&SETTINGS.units==='lb')?'lb':'kg';}
function dispW(kg){return kg==null?'—':fromKg(kg).toFixed(1)+' '+wUnit();}
function bmiCalc(kg,h){return (kg&&h)?kg/Math.pow(h/100,2):null;}
function bmiCat(b){if(b==null)return '';if(b<18.5)return 'Underweight';if(b<25)return 'Normal';if(b<30)return 'Overweight';return 'Obese';}
function navyBF(sex,h,neck,waist,hip){
  if(!h||!neck||!waist)return null;
  if(sex==='female'){if(!hip)return null;const v=495/(1.29579-0.35004*log10(waist+hip-neck)+0.22100*log10(h))-450;return (v>0&&v<70)?v:null;}
  const inner=waist-neck;if(inner<=0)return null;
  const v=495/(1.0324-0.19077*log10(inner)+0.15456*log10(h))-450;return (v>0&&v<70)?v:null;
}

async function getPhotos(){return ((await DB.getAll('photos'))||[]).sort((a,b)=>a.ts-b.ts);}
function latestVal(entries,f){for(let i=entries.length-1;i>=0;i--){const v=entries[i][f];if(v!=null&&v!=='')return v;}return null;}

function resizeImage(file,maxDim){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let{width:w,height:h}=img;if(w>h&&w>maxDim){h=h*maxDim/w;w=maxDim;}else if(h>maxDim){w=w*maxDim/h;h=maxDim;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.82));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});
}

/* ================= Phase 9: Smart Coach (rule-based) ================= */
let PLATE={target:'',bar:null};

function consecutiveEndingToday(dates){
  const set=new Set(dates);const d=new Date();
  if(!set.has(todayStr())){d.setDate(d.getDate()-1);if(!set.has(d.toISOString().slice(0,10)))return 0;}
  let c=0;while(set.has(d.toISOString().slice(0,10))){c++;d.setDate(d.getDate()-1);}return c;
}
function pairInsight(out,bal,a,b){const A=bal[a]||0,B=bal[b]||0;if(A+B<6)return;const hi=A>=B?a:b,lo=A>=B?b:a,H=bal[hi],L=bal[lo];if(H>=L*1.5&&H-L>=4)out.push({icon:'⚖️',text:`${lo} volume is lower than ${hi} — add more ${lo.toLowerCase()} work.`});}
function liftProgress(sessions,id){
  const byMonth={};
  sessions.forEach(s=>{const ex=(s.exercises||[]).find(e=>e.id===id);if(!ex)return;let mw=0;(ex.sets||[]).forEach(st=>{if(st.done){const w=parseFloat(st.weight)||0;if(w>mw)mw=w;}});if(mw<=0)return;const k=s.date.slice(0,7);byMonth[k]=Math.max(byMonth[k]||0,mw);});
  const keys=Object.keys(byMonth).sort();if(keys.length<2)return null;
  const last=byMonth[keys[keys.length-1]],prev=byMonth[keys[keys.length-2]];
  if(last>prev){const pct=Math.round((last-prev)/prev*100);if(pct>=3){const x=exById(id);return {icon:'📈',text:`You've increased ${x?x.name:id} by ${pct}% recently.`,kind:'good'};}}
  return null;
}
function buildInsights(sessions){
  const out=[];
  if(!sessions.length){out.push({icon:'💡',text:'Log your first workout to unlock personalized insights.'});return out;}
  const now=Date.now();
  const streakDays=consecutiveEndingToday([...new Set(sessions.map(s=>s.date))]);
  if(streakDays>=5)out.push({icon:'🔥',text:`You've trained ${streakDays} days in a row — consider a rest day.`,kind:'warn'});
  const lastTrained={};MUSCLE_LIST.forEach(m=>lastTrained[m]=null);
  sessions.forEach(s=>{const ms=sessionMuscleSets(s);for(const k in ms){if(lastTrained[k]===null||s.ts>lastTrained[k])lastTrained[k]=s.ts;}});
  let worst=null;['Legs','Back','Chest'].forEach(m=>{if(lastTrained[m]){const d=Math.floor((now-lastTrained[m])/86400000);if(d>=7&&(!worst||d>worst.d))worst={m,d};}});
  if(worst)out.push({icon:'📅',text:`You haven't trained ${worst.m} in ${worst.d} days.`,kind:'warn'});
  const cutoff=now-30*86400000,bal={};MUSCLE_LIST.forEach(m=>bal[m]=0);
  sessions.filter(s=>s.ts>=cutoff).forEach(s=>{const ms=sessionMuscleSets(s);for(const k in ms)bal[k]+=ms[k];});
  pairInsight(out,bal,'Chest','Back');pairInsight(out,bal,'Biceps','Triceps');
  ['bench-press','squat','deadlift','ohp'].forEach(id=>{const imp=liftProgress(sessions,id);if(imp)out.push(imp);});
  const ws=weekStart(now);if(sessions.filter(s=>weekStart(s.ts)===ws).length===0)out.push({icon:'👟',text:'No workouts yet this week — time to get moving.'});
  if(!out.length)out.push({icon:'✅',text:'Great balance and consistency — keep it up!',kind:'good'});
  return out;
}
function overloadSuggestions(sessions){
  const inc=(typeof SETTINGS!=='undefined'&&SETTINGS.units==='lb')?5:2.5;
  const byEx={};
  sessions.forEach(s=>{(s.exercises||[]).forEach(ex=>{const done=(ex.sets||[]).filter(st=>st.done);if(!done.length)return;let mw=0,rAt=0;done.forEach(st=>{const w=parseFloat(st.weight)||0,r=parseFloat(st.reps)||0;if(w>mw){mw=w;rAt=r;}else if(w===mw&&r>rAt)rAt=r;});byEx[ex.id]={ts:s.ts,w:mw,r:rAt};});});
  return Object.entries(byEx).filter(([id,d])=>d.w>0).sort((a,b)=>b[1].ts-a[1].ts).slice(0,8).map(([id,d])=>{
    const x=exById(id);let sug;
    if(d.r>=12)sug=`Add weight → try ${d.w+inc} ${unitLabel()}`;
    else if(d.r>=8)sug=`Add a rep, or +${inc} ${unitLabel()}`;
    else if(d.r>0)sug=`Build reps at ${d.w} ${unitLabel()}`;
    else sug='Keep logging to get a target';
    return {id,name:x?x.name:id,last:`Last: ${d.w} ${unitLabel()} × ${d.r||'—'}`,sug};
  });
}
function recommendation(sessions){
  const now=Date.now();const lastTrained={};MUSCLE_LIST.forEach(m=>lastTrained[m]=null);
  sessions.forEach(s=>{const ms=sessionMuscleSets(s);for(const k in ms){if(lastTrained[k]===null||s.ts>lastTrained[k])lastTrained[k]=s.ts;}});
  let worst=null;MUSCLE_LIST.forEach(m=>{const lt=lastTrained[m];const d=lt===null?9999:Math.floor((now-lt)/86400000);if(!worst||d>worst.d)worst={m,d};});
  let ref=null;
  for(const p of plansData()){for(let i=0;i<p.days.length;i++){const muscles=new Set(p.days[i].ex.map(e=>{const x=exById(e.id);return x?x.muscle:'';}));if(muscles.has(worst.m)){ref={planId:p.id,dayIdx:i,name:p.name+' · '+p.days[i].name};break;}}if(ref)break;}
  return {group:worst.m,days:worst.d,ref};
}
function deloadCheck(sessions){const ws=weekStart(Date.now());let ok=0;for(let i=0;i<4;i++){const w=ws-i*604800000;if(sessions.filter(s=>weekStart(s.ts)===w).length>=3)ok++;else break;}return ok>=4;}
function platesFor(target,bar,unit){
  if(isNaN(target)||target<=0)return {err:'Enter a target weight.'};
  if(target<bar)return {err:'Target is below the bar weight ('+bar+' '+unit+').'};
  const denom=unit==='lb'?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25];
  let rem=Math.round((target-bar)/2*100)/100;const res=[];

  return {side:Math.round((target-bar)/2*100)/100,res,leftover:rem};
}
