/* --- minimal hand-rolled PDF (no external library) --- */
function buildPDF(lines){
  const pageW=612,pageH=792,top=740,lineH=16,bottom=54;
  const per=Math.floor((top-bottom)/lineH);
  const pages=[];for(let i=0;i<lines.length;i+=per)pages.push(lines.slice(i,i+per));
  if(!pages.length)pages.push(['(empty)']);
  const enc=s=>String(s).replace(/[^\x20-\x7E]/g,'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  let objNum=4;const contentN=[],pageN=[];pages.forEach(()=>{contentN.push(objNum++);pageN.push(objNum++);});
  const objs={};
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids ['+pageN.map(n=>n+' 0 R').join(' ')+'] /Count '+pages.length+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  pages.forEach((pl,pi)=>{
    let content='BT /F1 11 Tf '+lineH+' TL 54 '+top+' Td ';
    pl.forEach(ln=>{content+='('+enc(ln)+') Tj T* ';});
    content+='ET';
    objs[contentN[pi]]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
    objs[pageN[pi]]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pageW+' '+pageH+'] /Resources << /Font << /F1 3 0 R >> >> /Contents '+contentN[pi]+' 0 R >>';
  });
  const total=Math.max(...Object.keys(objs).map(Number));
  let pdf='%PDF-1.4\n';const off={};
  for(let i=1;i<=total;i++){off[i]=pdf.length;pdf+=i+' 0 obj\n'+objs[i]+'\nendobj\n';}
  const xref=pdf.length;
  pdf+='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=total;i++)pdf+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  return pdf;
}

      <div class="card"><h2>Restore</h2><p class="muted" style="margin:0 0 12px">Import a backup file. This replaces all current data on this device.</p><input type="file" id="impFile" accept="application/json,.json" style="display:none"><button class="btn secondary" id="impBtn">⬆ Import Backup</button></div>
      <div class="card" style="border-color:#f43f5e"><h2 style="color:#f43f5e">Danger Zone</h2><p class="muted" style="margin:0 0 12px">Erase all data and start fresh. This cannot be undone.</p><button class="btn ghost" id="clearBtn" style="color:#f43f5e">🗑 Clear All Data</button></div>`;
    root.querySelector('#back').addEventListener('click',()=>navigate(back));
    root.querySelector('#expJson').addEventListener('click',async()=>{const data=await gatherBackup();downloadFile('flextrak-backup-'+todayStr()+'.json','application/json',JSON.stringify(data));toast('Backup exported');});
    const file=root.querySelector('#impFile');
    root.querySelector('#impBtn').addEventListener('click',()=>file.click());
    file.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const data=JSON.parse(r.result);if(data._app!=='FlexTrak'&&data._app!=='FitTrack'){toast('Not a FlexTrak backup');return;}if(!confirm('Import this backup? It will replace ALL current data.'))return;await restoreBackup(data);toast('Restored — reloading…');setTimeout(()=>location.reload(),700);}catch(err){console.error(err);toast('Invalid backup file');}};r.readAsText(f);});
    root.querySelector('#clearBtn').addEventListener('click',async()=>{if(!confirm('Erase ALL data permanently?'))return;if(!confirm('Are you absolutely sure? This cannot be undone.'))return;for(const s of BACKUP_STORES){try{await DB.clear(s);}catch(e){}}toast('All data cleared — reloading…');setTimeout(()=>location.reload(),700);});
  });
}

function setTopDate(){const d=new Date();document.getElementById('topDate').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
async function boot(){
  setTopDate();
  try{
    await DB.open();
    const saved=await DB.getKV('settings',null);
    SETTINGS=saved?{...DEFAULT_SETTINGS,...saved}:{...DEFAULT_SETTINGS};
    if(!saved) await DB.setKV('settings',SETTINGS);
    USER_GOALS=await DB.getKV('goals',[]);
    FAVORITES=await DB.getKV('favorites',[]);
    SESSION=await DB.getKV('activeSession',null);
    LAST_SESSION=await DB.getKV('lastSession',null);
    BODY_WEIGHT_KG=await DB.getKV('bodyweight',70);
    MY_EQUIPMENT=await DB.getKV('myEquipment',['Barbell','Dumbbell','Bodyweight','Grip']);
    // built-in library now loads from exercises.js (in-memory)
  }catch(err){console.error('Init failed:',err);}
  applyTheme();
  document.getElementById('tabbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;navigate(b.dataset.tab);});
  navigate('home');
}
boot();
</script>
